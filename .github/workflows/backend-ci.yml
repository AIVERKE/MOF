name: Backend CI MOF

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ main ]

jobs:
  check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar estilo de codigo
        run: npm run lint
        continue-on-error: true

      - name: Verificar tipos y sintaxis
        run: npx tsc --noEmit

      - name: Compilar proyecto (Build)
        run: npm run build
